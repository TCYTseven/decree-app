[project]
name = "inventory-api"
version = "0.3.0"
description = "Inventory service: track items and the users who manage them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
inventory = "app.cli:app"

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
test = "pytest -q"
lint = "ruff check ."
migrate = "alembic upgrade head"
deploy = { shell = "fly deploy --remote-only" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
