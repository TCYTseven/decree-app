name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.12 is the minimum (package.json "engines"): @clack/prompts 1.x imports
        # util.styleText and commander 14 requires Node >= 20.
        node: ["20.12", 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the packed tarball (local, global and npx installs)
        run: bash scripts/smoke.sh --no-build

  unsupported-node:
    # The CLI must fail with a clear message (not a module-link SyntaxError) on old Node.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Old Node prints the version requirement
        run: |
          set +e
          out="$(node dist/cli.js --help 2>&1)"; code=$?
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "requires Node.js >= 20.12"
