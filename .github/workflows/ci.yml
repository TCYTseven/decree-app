name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the bundle
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          cp -r test/fixtures/express-openapi /tmp/smoke
          node dist/cli.js init --yes --offline --goal "Operate the API and run tests" --cwd /tmp/smoke
          test -f /tmp/smoke/decree.json
          test -f /tmp/smoke/agent/README.md
