name: Bug report
description: Something crashed or did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output (add --verbose for a stack trace).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: decree-harness version
      placeholder: npx decree-harness --version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: Node 22.11, macOS 15
    validations:
      required: true
  - type: textarea
    id: repo
    attributes:
      label: Project details
      description: Framework, language, monorepo or not, and anything unusual about the layout. A public repo link helps most.
